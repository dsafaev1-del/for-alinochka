<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0033">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Подарок 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    height: -webkit-fill-available;
    -webkit-text-size-adjust: 100%;
  }

  html, body {
    height: 100%;
    min-height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
    background: #1a0033;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    position: fixed;
    inset: 0;
  }

  /* ============================================
     ЗАСТАВКА В СТИЛЕ IPHONE
     ============================================ */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(30px + env(safe-area-inset-top)) 30px calc(30px + env(safe-area-inset-bottom));
    cursor: pointer;
    transition: opacity 0.6s ease, visibility 0.6s;
  }
  .splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-content { text-align: center; max-width: 300px; animation: splashIn 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
  @keyframes splashIn {
    from { opacity: 0; transform: translateY(20px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .bell-wrap { position: relative; width: 80px; height: 80px; margin: 0 auto 22px; display: flex; align-items: center; justify-content: center; }
  .bell-svg { width: 62px; height: 62px; animation: bellRing 2.4s ease-in-out infinite; transform-origin: 50% 20%; }
  @keyframes bellRing {
    0%, 70%, 100% { transform: rotate(0deg); }
    75% { transform: rotate(-12deg); } 80% { transform: rotate(12deg); }
    85% { transform: rotate(-8deg); }  90% { transform: rotate(8deg); }
  }
  .bell-slash {
    position: absolute; top: 50%; left: 50%;
    width: 78px; height: 3px;
    background: #ff3b30; border-radius: 2px;
    transform: translate(-50%, -50%) rotate(-45deg);
    box-shadow: 0 0 12px rgba(255, 59, 48, 0.6);
    animation: slashPulse 2s ease-in-out infinite;
  }
  @keyframes slashPulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
  .splash-title { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 10px; letter-spacing: -0.3px; }
  .splash-text { font-size: 15px; font-weight: 400; color: rgba(255, 255, 255, 0.7); line-height: 1.5; margin-bottom: 34px; letter-spacing: -0.2px; }
  .splash-hint { font-size: 12px; font-weight: 400; color: rgba(255, 255, 255, 0.4); animation: hintPulse 2s ease-in-out infinite; letter-spacing: 0.2px; }
  @keyframes hintPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.85; } }

  /* ============================================ */

  .sky {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #2d0b5a 0%, #6b1a7a 20%, #c7367f 40%, #ff5f6d 60%, #ff9966 75%, #ffd166 90%, #ff5f6d 100%);
    background-size: 400% 400%;
    animation: skyShift 18s ease infinite;
    z-index: 0;
  }
  @keyframes skyShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.5;
    z-index: 1; pointer-events: none;
    animation: blobFloat 14s ease-in-out infinite;
    will-change: transform;
  }
  .blob.b1 { width: 380px; height: 380px; background: #ff2e94; top: -100px; left: -100px; }
  .blob.b2 { width: 340px; height: 340px; background: #4b2eff; bottom: -80px; right: -80px; animation-delay: -3s; }
  .blob.b3 { width: 300px; height: 300px; background: #ffd166; top: 40%; left: 60%; opacity: 0.35; animation-delay: -6s; }
  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, -30px) scale(1.1); }
    66%      { transform: translate(-30px, 40px) scale(0.95); }
  }

  .star {
    position: fixed; width: 2px; height: 2px;
    background: #fff; border-radius: 50%;
    opacity: 0; z-index: 2;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
    animation: twinkle linear infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50%      { opacity: 1; transform: scale(1.2); }
  }

  .balloon {
    position: fixed; bottom: -120px; z-index: 2;
    font-size: 42px; pointer-events: none;
    will-change: transform;
  }

  .confetti {
    position: fixed; top: -20px; z-index: 4;
    pointer-events: none; will-change: transform;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) scale(0.8); opacity: 0; }
  }

  .heart {
    position: fixed; top: -40px; z-index: 5;
    pointer-events: none; will-change: transform;
    filter: drop-shadow(0 0 10px rgba(255, 100, 180, 0.7));
  }
  @keyframes heartFall {
    0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(0.6); opacity: 0; }
    10%  { opacity: 1; transform: translateY(10vh) translateX(-10px) rotate(-15deg) scale(1); }
    50%  { transform: translateY(55vh) translateX(30px) rotate(15deg) scale(1.1); }
    90%  { opacity: 1; }
    100% { transform: translateY(115vh) translateX(-20px) rotate(-10deg) scale(0.9); opacity: 0; }
  }

  .cat {
    position: fixed;
    top: 0; left: 0;
    z-index: 3;
    pointer-events: none;
    will-change: transform;
    transform-origin: center center;
  }
  .cat span {
    display: block;
    line-height: 1;
    filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 14px rgba(255, 220, 150, 0.4));
    will-change: transform;
  }

  .burst-particle {
    position: fixed;
    z-index: 6;
    pointer-events: none;
    font-size: 16px;
    line-height: 1;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 8px rgba(255, 220, 150, 0.9));
  }

  /* ============================================
     КАРТОЧКА — iOS glassmorphism, компактная
     ============================================ */
  .card {
    position: relative;
    z-index: 5;
    /* Стекло: полупрозрачность + тяжёлый блюр + насыщенность */
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 22px;
    /* Компактные отступы для мобильного */
    padding: 28px 22px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.35),
      0 0 40px rgba(255, 100, 200, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    transition: opacity 0.32s ease, transform 0.32s ease;
    will-change: opacity, transform;
    overflow: hidden;
  }

  /* Верхний светящийся блик — как на iOS-стекле */
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
    pointer-events: none;
  }

  /* Внутренний мягкий блик сверху */
  .card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -20%;
    width: 140%;
    height: 100%;
    background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.18) 0%, transparent 60%);
    pointer-events: none;
  }

  .card.fade-out {
    opacity: 0;
    transform: translateY(-8px) scale(0.96);
  }

  .card.enter-up    { animation: enterUp    0.7s cubic-bezier(0.25, 1.1, 0.4, 1); }
  .card.enter-right { animation: enterRight 0.7s cubic-bezier(0.25, 1.1, 0.4, 1); }
  .card.enter-left  { animation: enterLeft  0.7s cubic-bezier(0.25, 1.1, 0.4, 1); }
  .card.enter-scale { animation: enterScale 0.7s cubic-bezier(0.34, 1.4, 0.5, 1); }
  .card.enter-flip  { animation: enterFlip  0.85s cubic-bezier(0.25, 1.1, 0.4, 1); }

  @keyframes enterUp {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes enterRight {
    from { opacity: 0; transform: translateX(50px) rotate(2deg); }
    to   { opacity: 1; transform: translateX(0) rotate(0); }
  }
  @keyframes enterLeft {
    from { opacity: 0; transform: translateX(-50px) rotate(-2deg); }
    to   { opacity: 1; transform: translateX(0) rotate(0); }
  }
  @keyframes enterScale {
    from { opacity: 0; transform: scale(0.75); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes enterFlip {
    from { opacity: 0; transform: perspective(800px) rotateY(30deg) scale(0.92); }
    to   { opacity: 1; transform: perspective(800px) rotateY(0) scale(1); }
  }

  .progress {
    display: flex; gap: 6px;
    justify-content: center; margin-bottom: 20px;
    position: relative; z-index: 1;
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transition: all 0.4s ease;
  }
  .dot.active {
    background: linear-gradient(135deg, #ffd166, #ff5f6d);
    box-shadow: 0 0 8px rgba(255, 200, 100, 0.8);
  }
  .dot.current { width: 16px; border-radius: 3px; }

  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 12px;
    color: #ffd166; letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px; display: block;
    text-shadow: 0 0 14px rgba(255, 200, 100, 0.6);
    position: relative; z-index: 1;
  }

  .emoji-wrap { margin-bottom: 12px; display: block; position: relative; z-index: 1; }
  .emoji {
    font-size: 40px; display: inline-block;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 20px rgba(255, 200, 100, 0.5));
    animation: softFloat 4s ease-in-out infinite;
  }
  @keyframes softFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-7px) rotate(3deg); }
  }

  .ring-scene {
    position: relative; height: 90px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .ring-glow {
    position: absolute; width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 220, 130, 0.55) 0%, transparent 65%);
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.2); opacity: 1; }
  }
  .ring {
    font-size: 54px; position: relative; z-index: 2;
    animation: ringShine 4s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(255, 220, 150, 1)) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.3));
  }
  @keyframes ringShine {
    0%, 100% { transform: scale(1) rotate(-5deg); }
    50%      { transform: scale(1.08) rotate(5deg); }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 600;
    color: #fff; margin-bottom: 12px;
    line-height: 1.3; letter-spacing: 0.3px;
    text-shadow: 0 0 24px rgba(255, 150, 200, 0.5), 0 2px 8px rgba(0, 0, 0, 0.35);
    position: relative; z-index: 1;
  }
  h1 .name {
    display: block; font-style: italic; font-weight: 400;
    font-size: 16px; color: #ffd166;
    margin-bottom: 6px; letter-spacing: 1.5px;
    text-shadow: 0 0 16px rgba(255, 200, 100, 0.8);
  }

  p {
    font-size: 13.5px; font-weight: 300;
    color: rgba(255, 255, 255, 0.95);
    line-height: 1.7; margin-bottom: 22px;
    letter-spacing: 0.1px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    position: relative; z-index: 1;
  }
  p em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 16px;
    color: #ffd166;
    text-shadow: 0 0 12px rgba(255, 200, 100, 0.6);
  }
  p .hint {
    display: block; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.18);
    font-size: 11px; font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    color: rgba(255, 220, 150, 0.9);
    letter-spacing: 1.2px;
  }

  button {
    background: linear-gradient(135deg, rgba(255, 95, 109, 0.95) 0%, rgba(255, 195, 113, 0.95) 50%, rgba(255, 95, 109, 0.95) 100%);
    background-size: 200% auto;
    color: #2a0845; border: none;
    padding: 13px 32px;
    font-size: 12px; font-family: 'Inter', sans-serif;
    font-weight: 600; letter-spacing: 2.5px;
    text-transform: uppercase;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow:
      0 10px 26px rgba(255, 95, 109, 0.45),
      0 0 20px rgba(255, 200, 100, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    position: relative; overflow: hidden;
    min-height: 44px;
    z-index: 1;
  }
  button:active { transform: translateY(1px) scale(0.97); }

  .card.final {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 220, 150, 0.45);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.4),
      0 0 60px rgba(255, 150, 200, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -1px 0 rgba(255, 255, 255, 0.1);
  }
  .card.final h1 {
    font-size: 30px;
    background: linear-gradient(135deg, #fff 0%, #ffd166 50%, #ff5f6d 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s linear infinite;
    text-shadow: none;
  }
  @keyframes gradientShift { to { background-position: 200% center; } }

  /* ============================================
     КНОПКИ В УГЛАХ
     ============================================ */
  .corner-btn {
    position: fixed;
    z-index: 10;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    padding: 0;
    box-shadow:
      0 4px 16px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .corner-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.28); }

  .music-btn {
    top: calc(14px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right));
  }
  .music-btn.playing { animation: musicSpin 4s linear infinite; }
  @keyframes musicSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  .back-btn {
    bottom: calc(14px + env(safe-area-inset-bottom));
    left: calc(14px + env(safe-area-inset-left));
    font-size: 20px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: all 0.35s ease;
  }
  .back-btn.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /* ============================================
     ОЧЕНЬ МАЛЕНЬКИЕ ЭКРАНЫ (iPhone SE и похожие)
     ============================================ */
  @media (max-height: 640px) {
    .card { padding: 22px 18px 18px; }
    h1 { font-size: 19px; }
    p { font-size: 12.5px; margin-bottom: 18px; }
    .emoji { font-size: 34px; }
    .ring { font-size: 46px; }
    .ring-scene { height: 76px; margin-bottom: 8px; }
    .progress { margin-bottom: 14px; }
    .step-num { font-size: 11px; margin-bottom: 10px; }
    button { padding: 12px 28px; font-size: 11px; }
    p .hint { margin-top: 10px; padding-top: 10px; }
  }
</style>
</head>
<body>

<!-- ЗАСТАВКА -->
<div class="splash" id="splash">
  <div class="splash-content">
    <div class="bell-wrap">
      <svg class="bell-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#fff"/>
      </svg>
      <div class="bell-slash"></div>
    </div>
    <div class="splash-title">Прибавь громкость</div>
    <div class="splash-text">Для лучшего впечатления<br>выключи беззвучный режим</div>
    <div class="splash-hint">Коснись экрана, чтобы продолжить</div>
  </div>
</div>

<div class="sky"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<audio id="bgMusic" loop></audio>

<button class="corner-btn music-btn" id="musicBtn" title="Музыка">♪</button>
<button class="corner-btn back-btn" id="backBtn" title="Назад">‹</button>

<script>
  console.log('%c🎂 Версия 3.1 — iOS glass + компактные карточки', 'background: #ff5f6d; color: white; padding: 4px 8px; border-radius: 4px;');

  const MUSIC_URL = "";

  const steps = [
    { emoji: "🎂", title: "Эту веб-страницу я сделал специально для тебя", text: "Не тыкай всё подряд — читай внимательно и следуй шагам. Надеюсь, ты оценишь.", button: "Поняла" },
    { emoji: "🔑", step: "Шаг 1", title: "Иди туда, где я обычно сижу", text: "Там, на моём рабочем месте, спрятано кое-что для тебя. Поищи хорошенько.", button: "Нашла" },
    { emoji: "🎫", step: "Шаг 2", title: "Там же должна быть карточка", text: "Небольшая такая, похожа на пропуск. Прихвати её с собой — без неё дальше никак.", button: "Взяла" },
    { emoji: "🚗", step: "Шаг 3", title: "Спускайся на парковку", text: "Ключи, которые ты нашла — от машины. Она стоит на подземной парковке. Карточка откроет тебе туда доступ.", button: "Иду" },
    { emoji: "🔍", step: "Шаг 4", title: "Загляни между креслами", text: "Там есть небольшое отделение под стаканы. То, что ты ищешь — внутри.", hint: "Не спеши", button: "Открываю" },
    { emoji: "💍", ring: true, step: "Вот оно", title: "Твой подарок", text: "Надеюсь, понравится. И кстати — квест на этом не заканчивается.", button: "Дальше" },
    { emoji: "🏠", step: "И последнее", title: "Возвращайся домой", text: "Возьми кольцо с собой и поднимайся обратно в квартиру. У тебя есть всё время мира.", button: "Иду домой" },
    { emoji: "✨", step: "Последний шаг", title: "Закрой глаза", text: "Зайди в комнату, закрой глаза и подожди немного. И не подглядывай, пожалуйста.", button: "Закрыла" }
  ];

  const finalScreen = {
    title: "С днём рождения",
    text: "Очень рад, что ты у меня есть."
  };

  // ============================================
  //   ЗВУК «МИУ»
  // ============================================

  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playMeow() {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const dur = 0.22 + Math.random() * 0.05;
      const base = 880 + Math.random() * 120;

      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base * 0.85, now);
      osc.frequency.linearRampToValueAtTime(base * 1.15, now + dur * 0.25);
      osc.frequency.linearRampToValueAtTime(base * 1.20, now + dur * 0.40);
      osc.frequency.linearRampToValueAtTime(base * 0.62, now + dur);

      const osc2 = ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(base * 2 * 0.85, now);
      osc2.frequency.linearRampToValueAtTime(base * 2 * 1.20, now + dur * 0.40);
      osc2.frequency.linearRampToValueAtTime(base * 2 * 0.62, now + dur);
      const osc2Gain = ctx.createGain();
      osc2Gain.gain.value = 0.10;

      const formant = ctx.createBiquadFilter();
      formant.type = 'bandpass';
      formant.frequency.setValueAtTime(2700, now);
      formant.frequency.linearRampToValueAtTime(2400, now + dur * 0.35);
      formant.frequency.linearRampToValueAtTime(900, now + dur);
      formant.Q.value = 3.5;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.35, now + 0.015);
      gain.gain.setValueAtTime(0.32, now + dur * 0.45);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(formant);
      osc2.connect(osc2Gain);
      osc2Gain.connect(formant);
      formant.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now); osc.stop(now + dur);
      osc2.start(now); osc2.stop(now + dur);
    } catch(e) { console.warn('Meow error:', e); }
  }

  // ============================================
  //   КОТИКИ — requestAnimationFrame
  // ============================================

  const catEmojis = ['🐈', '🐈‍⬛', '🐱', '🐈', '🐈‍⬛'];
  const activeCats = [];

  function makeCat() {
    const emoji = catEmojis[Math.floor(Math.random() * catEmojis.length)];
    const size = 28 + Math.random() * 20;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const el = document.createElement('div');
    el.className = 'cat';
    const span = document.createElement('span');
    span.textContent = emoji;
    span.style.fontSize = size + 'px';
    el.appendChild(span);
    document.body.appendChild(el);

    const behavior = Math.floor(Math.random() * 4);
    const cat = { el, span, behavior, startTime: performance.now() };

    if (behavior === 0) {
      cat.fromLeft = Math.random() > 0.5;
      cat.y = 80 + Math.random() * (vh - 180);
      cat.x0 = cat.fromLeft ? -80 : vw + 80;
      cat.x1 = cat.fromLeft ? vw + 80 : -80;
      cat.duration = 9000 + Math.random() * 6000;
      span.style.transform = cat.fromLeft ? 'scaleX(1)' : 'scaleX(-1)';
      cat.wobbleAmp = 6;
      cat.wobbleFreq = 0.012 + Math.random() * 0.008;

    } else if (behavior === 1) {
      cat.fromLeft = Math.random() > 0.5;
      cat.fromTop = Math.random() > 0.5;
      cat.x0 = cat.fromLeft ? -80 : vw + 80;
      cat.y0 = cat.fromTop ? 80 : vh - 80;
      cat.x1 = cat.fromLeft ? vw + 80 : -80;
      cat.y1 = cat.fromTop ? vh - 80 : 80;
      cat.duration = 12000 + Math.random() * 7000;
      span.style.transform = cat.fromLeft ? 'scaleX(1)' : 'scaleX(-1)';
      cat.wobbleAmp = 5;
      cat.wobbleFreq = 0.008 + Math.random() * 0.006;

    } else if (behavior === 2) {
      cat.x0 = 40 + Math.random() * (vw - 100);
      cat.y0 = 100 + Math.random() * (vh - 260);
      cat.duration = 3000 + Math.random() * 2000;
      cat.x1 = cat.x0;
      cat.y1 = cat.y0;

    } else {
      cat.x0 = 60 + Math.random() * (vw - 120);
      cat.y0 = vh - 80;
      cat.jumpHeight = 180 + Math.random() * 180;
      cat.duration = 2200 + Math.random() * 1200;
      cat.xDrift = 40 + Math.random() * 60;
    }

    cat.startTime = performance.now();
    activeCats.push(cat);
  }

  function animateCats(now) {
    for (let i = activeCats.length - 1; i >= 0; i--) {
      const cat = activeCats[i];
      const t = Math.min(1, (now - cat.startTime) / cat.duration);

      if (t >= 1) {
        cat.el.remove();
        activeCats.splice(i, 1);
        continue;
      }

      let x = cat.x0, y = cat.y0;
      let extraRotate = 0;
      let extraScaleX = '', extraScaleY = '';
      let opacity = 1;

      if (cat.behavior === 0) {
        x = cat.x0 + (cat.x1 - cat.x0) * t;
        y = cat.y + Math.sin(now * cat.wobbleFreq) * cat.wobbleAmp;
        extraRotate = Math.sin(now * cat.wobbleFreq) * 3;

      } else if (cat.behavior === 1) {
        x = cat.x0 + (cat.x1 - cat.x0) * t;
        y = cat.y0 + (cat.y1 - cat.y0) * t + Math.sin(now * cat.wobbleFreq) * cat.wobbleAmp;
        extraRotate = (cat.fromLeft ? 1 : -1) * t * 18;

      } else if (cat.behavior === 2) {
        x = cat.x0; y = cat.y0;
        let s;
        if (t < 0.18)      { s = t / 0.18 * 1.3; opacity = t / 0.18; }
        else if (t < 0.35) { s = 1.3 - (t - 0.18) / 0.17 * 0.3; opacity = 1; }
        else if (t < 0.75) { s = 1 + Math.sin((t - 0.35) / 0.4 * Math.PI) * 0.05; opacity = 1; }
        else               { s = 1 - (t - 0.75) / 0.25 * 0.4; opacity = 1 - (t - 0.75) / 0.25; }
        extraScaleX = `scale(${Math.max(0, s)})`;
        extraScaleY = `scale(${Math.max(0, s)})`;
        extraRotate = t * 120;

      } else {
        const jumpT = t * 2;
        if (jumpT < 1) {
          y = cat.y0 - 4 * cat.jumpHeight * jumpT * (1 - jumpT);
          x = cat.x0 + cat.xDrift * t;
          const stretch = 1 + Math.sin(jumpT * Math.PI) * 0.15;
          extraScaleX = `scaleX(${1 / stretch})`;
          extraScaleY = `scaleY(${stretch})`;
        } else {
          x = cat.x0 + cat.xDrift;
          y = cat.y0;
          const landT = jumpT - 1;
          if (landT < 0.3) {
            const squash = 1 - Math.sin(landT / 0.3 * Math.PI) * 0.2;
            extraScaleX = `scaleX(${1 / squash})`;
            extraScaleY = `scaleY(${squash})`;
          }
        }
      }

      cat.el.style.transform = `translate3d(${x}px, ${y}px, 0) ${extraScaleX} ${extraScaleY} rotate(${extraRotate}deg)`;
      cat.el.style.opacity = opacity;
    }

    requestAnimationFrame(animateCats);
  }

  requestAnimationFrame(animateCats);

  function scheduleCat() {
    makeCat();
    setTimeout(scheduleCat, 2800 + Math.random() * 3500);
  }
  setTimeout(scheduleCat, 500);

  // ============================================
  //   ВСПЫШКА ПРИ ПЕРЕХОДЕ
  // ============================================

  const burstEmojis = ['✨', '⭐', '💫', '🌟'];

  function burstFromCard() {
    const c = document.querySelector('.card');
    if (!c) return;
    const rect = c.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const count = 14;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'burst-particle';
      p.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.fontSize = (12 + Math.random() * 10) + 'px';
      document.body.appendChild(p);

      const angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
      const dist = 110 + Math.random() * 110;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;

      p.style.transition = 'transform 0.9s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.9s ease';
      p.style.transform = 'translate(-50%, -50%) scale(0.5)';
      p.style.opacity = '1';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          p.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`;
          p.style.opacity = '0';
        });
      });

      setTimeout(() => p.remove(), 1300);
    }
  }

  // ============================================
  //   ФОН
  // ============================================

  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (2 + Math.random() * 4) + 's';
    s.style.animationDelay = Math.random() * 6 + 's';
    if (Math.random() > 0.7) s.style.width = s.style.height = '3px';
    document.body.appendChild(s);
  }

  function spawnBalloon() {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.textContent = '🎈';
    const hue = Math.floor(Math.random() * 360);
    b.style.filter = `drop-shadow(0 6px 12px rgba(0,0,0,0.3)) hue-rotate(${hue}deg) saturate(1.4)`;
    b.style.left = (5 + Math.random() * 90) + 'vw';
    b.style.fontSize = (32 + Math.random() * 26) + 'px';
    b.style.transform = 'translateY(120vh)';
    b.style.transition = 'transform 12s linear';
    document.body.appendChild(b);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        b.style.transform = 'translateY(-120vh)';
      });
    });
    setTimeout(() => b.remove(), 13000);
  }
  setInterval(spawnBalloon, 3200);
  for (let i = 0; i < 4; i++) setTimeout(spawnBalloon, i * 900);

  const confettiColors = ['#ff5f6d', '#ffd166', '#4b9eff', '#c471ed', '#39d98a', '#ff7eb6', '#fff'];
  function burstConfetti(count = 45) {
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      const size = 5 + Math.random() * 8;
      c.style.width = c.style.height = size + 'px';
      c.style.animation = `confettiFall ${2.5 + Math.random() * 2.5}s linear ${Math.random() * 0.5}s forwards`;
      if (Math.random() > 0.85) {
        c.style.width = c.style.height = '0';
        c.style.border = 'none';
        c.textContent = '✨';
        c.style.fontSize = (12 + Math.random() * 8) + 'px';
        c.style.background = 'transparent';
      }
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6500);
    }
  }

  const heartEmojis = ['❤️', '💖', '💕', '💗', '💓', '💝', '🩷'];
  function burstHearts(count = 30) {
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (18 + Math.random() * 22) + 'px';
      const dur = 3 + Math.random() * 3;
      const delay = Math.random() * 1.5;
      h.style.animation = `heartFall ${dur}s ease-in ${delay}s forwards`;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), (dur + delay + 0.5) * 1000);
    }
  }

  // ============================================
  //   ЛОГИКА
  // ============================================

  const card = document.createElement('div');
  card.className = 'card';
  document.body.appendChild(card);

  let current = 0;
  let isPlaying = false;
  const enterAnimations = ['enter-up', 'enter-right', 'enter-scale', 'enter-left', 'enter-flip', 'enter-up', 'enter-right'];
  let enterIndex = 0;

  function render() {
    const isFinal = current >= steps.length;
    const data = isFinal ? finalScreen : steps[current];

    let progressHTML = '';
    if (!isFinal) {
      progressHTML = '<div class="progress">';
      for (let i = 0; i < steps.length; i++) {
        let cls = 'dot';
        if (i < current) cls += ' active';
        if (i === current) cls += ' active current';
        progressHTML += `<div class="${cls}"></div>`;
      }
      progressHTML += '</div>';
    }

    let mediaHTML = '';
    if (data.ring) {
      mediaHTML = `<div class="ring-scene"><div class="ring-glow"></div><div class="ring">💍</div></div>`;
    } else if (data.emoji) {
      mediaHTML = `<span class="emoji-wrap"><span class="emoji">${data.emoji}</span></span>`;
    }

    const stepHTML = data.step ? `<span class="step-num">${data.step}</span>` : '';
    const nameHTML = data.name ? `<span class="name">${data.name}</span>` : '';
    const hintHTML = data.hint ? `<span class="hint">${data.hint}</span>` : '';
    const buttonHTML = data.button ? `<button id="nextBtn">${data.button}</button>` : '';

    card.className = 'card';
    void card.offsetWidth;
    const enterClass = enterAnimations[enterIndex % enterAnimations.length];
    enterIndex++;
    card.classList.add(enterClass);
    if (isFinal) card.classList.add('final');

    card.innerHTML = `
      ${progressHTML}
      ${stepHTML}
      ${mediaHTML}
      <h1>${nameHTML}${data.title}</h1>
      <p>${data.text}${hintHTML}</p>
      ${buttonHTML}
    `;

    const btn = document.getElementById('nextBtn');
    if (btn) {
      btn.addEventListener('click', () => { playMeow(); next(); });
    }

    const backBtn = document.getElementById('backBtn');
    if (!isFinal && current > 0) {
      backBtn.classList.add('visible');
    } else {
      backBtn.classList.remove('visible');
    }

    if (isFinal) {
      burstConfetti(100); burstHearts(35);
      setTimeout(() => { burstConfetti(80); burstHearts(30); }, 1200);
      setTimeout(() => { burstConfetti(60); burstHearts(35); }, 2400);
      setTimeout(() => { burstConfetti(60); burstHearts(30); }, 3600);
      setTimeout(() => burstHearts(40), 5000);
    } else {
      burstConfetti(30);
    }
  }

  function next() {
    card.classList.add('fade-out');
    setTimeout(() => {
      if (current < steps.length) {
        current++;
        burstFromCard();
        render();
      } else {
        card.classList.remove('fade-out');
      }
    }, 320);
  }

  function goBack() {
    if (current <= 0) return;
    playMeow();
    card.classList.add('fade-out');
    setTimeout(() => {
      current--;
      burstFromCard();
      render();
    }, 320);
  }

  document.getElementById('backBtn').addEventListener('click', goBack);

  const splash = document.getElementById('splash');
  splash.addEventListener('click', () => {
    splash.classList.add('hidden');
    try { getAudioCtx(); } catch(e) {}
  }, { once: true });

  const musicBtn = document.getElementById('musicBtn');
  const musicEl = document.getElementById('bgMusic');

  if (MUSIC_URL) {
    musicEl.innerHTML = `<source src="${MUSIC_URL}" type="audio/mpeg">`;
  } else {
    musicBtn.style.display = 'none';
  }

  musicBtn.addEventListener('click', () => {
    if (isPlaying) {
      musicEl.pause();
      musicBtn.classList.remove('playing');
      musicBtn.textContent = '♪';
    } else {
      musicEl.volume = 0.3;
      musicEl.play().catch(() => {});
      musicBtn.classList.add('playing');
      musicBtn.textContent = '♫';
    }
    isPlaying = !isPlaying;
  });

  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

  render();
</script>

</body>
</html>
